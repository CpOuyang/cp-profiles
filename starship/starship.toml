# Misty Night Powerline prompt for Bash.
"$schema" = "https://starship.rs/config-schema.json"
add_newline = false

format = """
[](#1e2433)\
$os\
[](bg:#557a95 fg:#1e2433)\
$directory\
([](bg:#6e9e8a fg:#557a95)\
$git_branch\
$git_status\
$nodejs\
$python\
$rust\
$golang\
[ ](bg:#d6b98c fg:#6e9e8a))\
$time\
[ ](fg:#d6b98c)\
$character"""

[aws]
disabled = true

[gcloud]
disabled = true

[os]
disabled = false
style = "bg:#1e2433 fg:#e8edf2"
format = "[ $symbol ]($style)"

[os.symbols]
Macos = "󰀵"

[directory]
style = "bg:#557a95 fg:#f7f8f5"
format = "[ $path ]($style)"
truncation_length = 4
truncate_to_repo = false
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:#6e9e8a fg:#142a26"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "bg:#6e9e8a fg:#142a26"
format = "[($all_status$ahead_behind )]($style)"

[nodejs]
symbol = ""
style = "bg:#6e9e8a fg:#142a26"
format = "[ $symbol( $version) ]($style)"

[python]
symbol = ""
style = "bg:#6e9e8a fg:#142a26"
format = '[ $symbol( $version)(\(#$virtualenv\)) ]($style)'

[rust]
symbol = ""
style = "bg:#6e9e8a fg:#142a26"
format = "[ $symbol( $version) ]($style)"

[golang]
symbol = ""
style = "bg:#6e9e8a fg:#142a26"
format = "[ $symbol( $version) ]($style)"

[time]
disabled = false
time_format = "%T"
utc_time_offset = "+8"
style = "bg:#d6b98c fg:#2b2a2d"
format = "[ $time ]($style)"

[character]
success_symbol = "[❯](bold fg:#6e9e8a)"
error_symbol = "[❯](bold fg:#c77d8b)"
